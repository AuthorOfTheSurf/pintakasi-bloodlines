<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pintakasi favicon — the rooster, pixel for pixel.

  GENERATED BY HAND from the `ROOSTER` map in src/app/admin/sprites.tsx, using
  that file's own palette (Cream base coat + Red trim, plus the shared COMB /
  BEAK / LEG / EYE constants). It is mirrored on X exactly the way BirdSprite
  mirrors it, because the maps are authored facing left and birds face RIGHT
  (ruled round 15) — the tab icon has to face the same way as every bird in
  the office.

  The bird is the 16x16 map drawn at 2x inside a 36x36 viewBox, offset (1,2),
  which leaves a couple of units of margin inside the dark plate. The plate is
  there on purpose: a transparent favicon vanishes against a dark browser tab.

  IF THE `ROOSTER` MAP OR THOSE COLORS CHANGE, THIS FILE MUST BE REGENERATED BY
  HAND. Nothing imports it and no test compares it — it will go stale silently.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" shape-rendering="crispEdges">
  <rect width="36" height="36" rx="7" fill="#12100d"/>
  <rect x="25" y="2" width="4" height="2" fill="#c92f1e"/>
  <rect x="23" y="4" width="8" height="2" fill="#c92f1e"/>
