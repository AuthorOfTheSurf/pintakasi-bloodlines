name: check

# The same gate as .githooks/pre-commit, plus types and tests — for the
# commits that never passed through a local hook (agents, web edits, PRs
# from other machines).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
